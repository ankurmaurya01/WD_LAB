<html>
<head>
 <title>Registration</title>
</head>

<body>
 <h2>Registration Page</h2>
 <form>
 <table>
 <tr>
 <td>Name:</td>
 <td><input type="text"></td>
 </tr>
 <tr>
 <td>Password:</td>
 <td><input type="password"></td>
 </tr>
 <tr>
 <td>E-mailid:</td>
 <td><input type="text"></td>
 </tr>
 <tr>
 <td>Phone number:</td>
 <td><input type="text"></td>
 </tr>
 <tr>
 <td>Sex:</td>
 <td>
 <input type="radio" name="sex"> Male
 <input type="radio" name="sex"> Female
 <input type="radio" name="sex"> Other
 </td>
 </tr>
 <tr>
 <td>Date of birth:</td>
 <td>
 <select><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
 <select><option>Jan</option><option>Feb</option><option>Mar</option><option>Apr</option><option>May</option><option>Jun</option><option>Jul</option><option>Aug</option><option>Sep</option><option>Oct</option><option>Nov</option><option>Dec</option></select>
 <select><option>2008</option><option>2007</option><option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option><option>2001</option><option>2000</option><option>1999</option><option>1998</option><option>1997</option><option>1996</option><option>1995</option><option>1994</option><option>1993</option><option>1992</option><option>1991</option><option>1990</option></select>
 </td>
 </tr>
 <tr>
 <td>Languages known:</td>
 <td>
 <input type="checkbox"> English
 <input type="checkbox"> Telugu
 <input type="checkbox"> Hindi
 <input type="checkbox"> Tamil
 </td>
 </tr>
 <tr>
 <td>Address:</td>
 <td><textarea rows="4" cols="30"></textarea></td>
 </tr>
 <tr>
 <td colspan="2" align="center">
 <input type="submit" value="Submit">
 <input type="reset" value="Reset">
 </td>
 </tr>
 </table>
 </form>
</body>

</html>
